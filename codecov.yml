# Barrière de couverture Codecov — voir ADR 0002 (chaîne CI/CD) et le spec #80.
#
# Deux stacks, deux uploads distincts poussés par ci.yml via OIDC (sans token) :
#   - flag `ts`   : lcov de l'extension VS Code (job test-ts)
#   - flag `java` : jacoco.xml du module de validation (job test-java)
#
# `project` (auto) informe sur la tendance globale des deux composants.
# `patch` (80 %) est la vraie barrière sur le code neuf, bloquante pour les deux
# stacks.
# Le composant `java` porte en plus un statut `project` à 80 % : depuis le socle
# de tests (wayfinder #116) la couverture absolue du module de validation est
# tenue au-dessus de 80 % (voir ADR 0002 §« Barrière de couverture »).

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
    patch:
      default:
        target: 80%

component_management:
  individual_components:
    - component_id: ts
      name: ts
      paths:
        - vscode-extension/**
    - component_id: java
      name: java
      paths:
        - fhir-mapbuilder-validation/**
      statuses:
        # Couverture absolue du module tenue >= 80 % depuis le socle (#116).
        # Le statut `patch` du composant hérite du défaut repo (80 %, bloquant).
        - type: project
          target: 80%

flags:
  ts:
    carryforward: true
  java:
    carryforward: true

# Fichiers hors périmètre de couverture (point d'entrée Spring, DTO/config
# sans logique, code de test). Ils n'entrent pas dans le calcul.
ignore:
  - "**/MatchBoxApplication.java"
  - "**/model/**"
  - "**/config/**"
  - "**/test/**"
