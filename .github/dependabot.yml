# Dependabot — les 3 écosystèmes du monorepo : Maven (module de validation Java),
# npm (extension VS Code) et GitHub Actions. Voir ADR 0002 (chaîne CI/CD) et le
# spec #80.
#
# Convention commune maven/npm : PR hebdomadaires le lundi, label
# `dependencies`, assignées à davidouagne, fenêtre de refroidissement de 3 jours
# avant de proposer une version fraîchement publiée.
#
# Préfixe de commit (aligné sur le `type-enum` de commitlint — cf.
# commitlint.config.mjs, ADR 0001) : `fix` pour les dépendances de PRODUCTION
# maven et npm, `build` pour les dépendances de dev et GitHub Actions.
# release-please n'ouvre une PR de release que si le changelog généré n'est pas
# vide, et masque `build` : un bump de dépendance livrée dans le `.vsix` (le jar
# Matchbox en tête, les dépendances runtime de l'extension) doit donc être un
# `fix(deps)` pour produire une release ; un bump d'outillage (spotless, mocha,
# actions...) n'en produit aucune. Le préfixe se règle par écosystème, pas par
# dépendance : une dépendance rangée en prod par erreur déclencherait de fausses
# releases (cf. typescript-eslint, déplacé en devDependencies). ADR 0003
# §Amendments (2026-09-20).
#
# Matchbox est exclu du groupe prod-minor-patch : sa PR reste individuelle, son
# titre nomme la dépendance et sa ligne de changelog aussi.
# Deux groupes, tous deux bornés à minor/patch : dev-dependencies d'un côté,
# prod-dependencies de l'autre. Les major restent hors groupe, en PR
# individuelles instruites à la main — un major ne doit jamais voyager
# silencieusement à côté de bumps sûrs dans une PR groupée qui a l'air propre
# (constaté sur #97 : typescript ^5 -> ^7 groupé avec des patchs, cassant
# npm ci en ERESOLVE). L'éligibilité à l'auto-merge est décidée par
# .github/workflows/dependabot-auto-merge.yml.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/fhir-mapbuilder-validation"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "davidouagne"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "health.matchbox:*"
    ignore:
      # Spring Boot 4 migration deferred (wayfinder map #48, decision ticket #50):
      # small effort, no blocker found, just not scheduled yet. Still take
      # minor/patch updates within the 3.x line automatically.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "davidouagne"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # @types/vscode's minor version tracks the VS Code release it targets, so
      # bumping it ahead of engines.vscode makes `vsce package` fail with
      # "@types/vscode greater than engines.vscode". Bump it by hand alongside
      # an engines.vscode bump instead.
      - dependency-name: "@types/vscode"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "davidouagne"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
