version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/fhir-mapbuilder-validation"
    schedule:
      interval: "weekly"
    ignore:
      # fhir.core.version must stay whatever version health.matchbox:matchbox-engine
      # itself requires — never bumped independently, or the two can drift out of
      # compatibility. Bump it by hand alongside a matchbox-engine version bump instead.
      - dependency-name: "ca.uhn.hapi.fhir:org.hl7.fhir.r4"
      - dependency-name: "ca.uhn.hapi.fhir:org.hl7.fhir.r5"
      # Spring Boot 4 migration deferred (wayfinder map #48, decision ticket #50):
      # small effort, no blocker found, just not scheduled yet. Still take
      # minor/patch updates within the 3.x line automatically.
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
    ignore:
      # @types/vscode's minor version tracks the VS Code release it targets, so
      # bumping it ahead of engines.vscode makes `vsce package` fail with
      # "@types/vscode greater than engines.vscode". Bump it by hand alongside
      # an engines.vscode bump instead.
      - dependency-name: "@types/vscode"
