name: Dependabot auto-merge

# Active l'auto-merge sur les PR de Dependabot dont la mise à jour est jugée
# sûre : tous les patchs, et les minors qui ne touchent qu'une dev-dependency
# directe. Tout le reste (minors de prod, majors) reste à instruire à la main.
# Voir ADR 0002 et le spec #80.
on: pull_request

# Rien par défaut : le job élève au strict nécessaire.
permissions: {}

jobs:
  dependabot:
    name: dependabot
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # Le GITHUB_TOKEN ne sert qu'à lire la PR : l'auto-merge passe par le PAT
    # AUTO_MERGE_TOKEN (voir l'étape ci-dessous).
    permissions:
      contents: read
      pull-requests: read # dependabot/fetch-metadata
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Enable auto-merge for eligible updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
           steps.metadata.outputs.dependency-type == 'direct:development')
        # --rebase : seule méthode autorisée sur main (ADR 0001, amendement du
        # 2026-10-06).
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Un merge fait avec le GITHUB_TOKEN ne déclenche aucun workflow sur
          # le push vers main (CI, Release). Le PAT, lui, les déclenche. Secret
          # Dependabot (et non Actions) : un run lancé par Dependabot ne voit
          # que ceux-là.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
