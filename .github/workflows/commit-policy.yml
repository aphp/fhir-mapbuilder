name: Commit policy

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]
  # Déclenché à la main par `release.yml` sur la branche de la PR de release
  # (celle-ci n'émet aucun `pull_request` : release-please l'ouvre via le
  # `GITHUB_TOKEN`). `dco` / `commitlint` restent gardés sur `pull_request`
  # et sont donc *skippés* ici — GitHub compte un check requis skippé
  # comme réussi. Le commit de release-please est structurellement garanti
  # (`signoff` + `chore(main): release …`, cf. ADR 0003). Voir ADR 0003
  # §Amendments, wayfinder #126.
  workflow_dispatch:

# Aucune permission par défaut : chaque job élève au strict minimum ce dont il a besoin.
permissions: {}

# github.event_name fait partie de la clé : un run workflow_dispatch n'annule
# pas celui d'une PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Chaque commit non-merge de la PR doit porter un trailer `Signed-off-by:` (DCO).
  # Plage BASE..HEAD uniquement : la règle n'est pas rétroactive sur l'historique existant.
  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every non-merge commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "No non-merge commits in range — nothing to check."
            exit 0
          fi
          status=0
          for sha in $commits; do
            subject=$(git show -s --format=%s "$sha")
            if git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "ok       $sha  $subject"
            else
              echo "missing  $sha  $subject"
              echo "::error::Commit $sha has no 'Signed-off-by:' trailer. Sign with 'git commit -s', or sign the whole branch with 'git rebase --signoff $BASE_SHA'."
              status=1
            fi
          done
          exit $status

  # Chaque commit non-merge de la PR doit être un Conventional Commit valide :
  # avec le merge par rebase, ce sont ces commits-là qui arrivent sur main et
  # alimentent release-please. Le titre de la PR n'y figure pas.
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
