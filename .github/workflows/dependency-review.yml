name: Dependency review

# Extrait de ci.yml (ADR 0002, avenant du 2026-09-20) pour que la liste des workflows
# ressemble à celle des dépôts frères. Même job, même nom de check : `dependency-review`
# reste l'un des checks requis du ruleset `main`.
#
# Contrôle de PR : `actions/dependency-review-action` compare le graphe de dépendances
# entre la base et la tête de la PR, et échoue si elle introduit une dépendance de
# sévérité haute ou critique, ou sous copyleft fort.
on:
  pull_request:
    branches: [main]
  # Déclenché à la main par `release.yml` sur la branche de la PR de release : release-
  # please l'ouvre via le `GITHUB_TOKEN`, ce qui n'émet aucun `pull_request`, et le check
  # requis resterait absent. Le job est alors sauté, et GitHub compte un check requis
  # sauté comme réussi. Voir ADR 0003 §Amendments, wayfinder #126.
  workflow_dispatch:

# Annule les runs en cours si un nouveau push arrive sur la même branche/PR
concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principe du moindre privilège : rien par défaut, le job élève au strict nécessaire
permissions: {}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # PR uniquement : le job compare le graphe de dépendances base <-> head.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency review
        # Épinglé au tag exact : le projet ne publie pas de tag majeur mouvant
        # (`@v5`) — contrairement à actions/checkout & co. Dependabot (écosystème
        # github-actions) le fait avancer.
        uses: actions/dependency-review-action@v5.0.0
        with:
          # Bloque toute dépendance *nouvellement introduite* portant une
          # vulnérabilité de sévérité haute ou critique.
          fail-on-severity: high
          # Refuse l'entrée de dépendances sous copyleft fort. EPL / MPL-2.0 /
          # CDDL restent tolérées (non listées ci-dessous).
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later
          # Allowlist d'exceptions au cas par cas (PURL), p. ex. :
          #   pkg:maven/com.example/foo, pkg:npm/bar
          # Vide = aucune exception.
          allow-dependencies-licenses: ""
