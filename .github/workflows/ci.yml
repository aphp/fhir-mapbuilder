name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Déclenché à la main par `release.yml` sur la branche de la PR de release :
  # release-please ouvre cette PR via le `GITHUB_TOKEN`, ce qui ne déclenche
  # aucun `pull_request`. `workflow_dispatch` est l'exception qui part quand
  # même depuis un contexte `GITHUB_TOKEN` — il rapporte les checks requis sur
  # le HEAD de la PR de release. Voir ADR 0003 §Amendments, wayfinder #126.
  workflow_dispatch:

# Annule les runs en cours si un nouveau push arrive sur la même branche/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principe du moindre privilège : rien par défaut, chaque job élève au strict nécessaire
permissions: {}

jobs:
  lint-ts:
    name: lint-ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Lit engines.node depuis package.json — pas de version en dur, pas de matrix
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: ESLint
        run: npx eslint src
        working-directory: vscode-extension

      - name: Prettier (check)
        run: npx prettier --check "src/**/*.ts"
        working-directory: vscode-extension

  lint-java:
    name: lint-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: Spotless + SpotBugs
        # `compile` d'abord : sans target/classes, spotbugs:check passe à vide.
        run: mvn -B compile spotless:check spotbugs:check
        working-directory: fhir-mapbuilder-validation

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: tsc --noEmit
        run: npm run check-types
        working-directory: vscode-extension

  test-ts:
    name: test-ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC : upload Codecov sans token
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build extension and test sources
        # `pretest` = compile-tests + compile (esbuild -> dist/) + lint ; requis
        # par les deux couches de test ci-dessous.
        run: npm run pretest
        working-directory: vscode-extension

      - name: Run unit tests with coverage
        # couche hors-hôte : mocha + c8 `--all --src src` -> coverage/unit/lcov.info
        run: npm run test:unit
        working-directory: vscode-extension

      - name: Run extension tests with coverage (with xvfb)
        # `--coverage` -> @vscode/test-cli + c8 -> vscode-extension/coverage/lcov.info
        run: xvfb-run -a npm run test:integration -- --coverage
        working-directory: vscode-extension

      - name: Upload unit coverage to Codecov (flag ts)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: vscode-extension/coverage/unit/lcov.info
          flags: ts

      - name: Upload extension coverage to Codecov (flag ts)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: vscode-extension/coverage/lcov.info
          flags: ts

  test-java:
    name: test-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC : upload Codecov sans token
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: mvn verify
        # jacoco:report (phase test) écrit target/site/jacoco/jacoco.xml
        run: mvn -B verify
        working-directory: fhir-mapbuilder-validation

      - name: Upload coverage to Codecov (flag java)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: fhir-mapbuilder-validation/target/site/jacoco/jacoco.xml
          flags: java

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: Install Node dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build the validation jar
        # -DskipTests : les tests Java tournent déjà dans le job test-java
        run: mvn -B package -DskipTests
        working-directory: fhir-mapbuilder-validation

      - name: Smoke-test the validation jar (GET /health -> 200)
        # Même script que le job `os-smoke` : le jar est lancé depuis un dossier
        # dont le nom contient un espace et un accent.
        run: bash .github/scripts/smoke-jar.sh fhir-mapbuilder-validation/target/fhir-mapbuilder-validation.jar

      - name: Upload the validation jar for the OS smoke jobs
        # Le jar est du Java pur : celui-ci, construit une seule fois, est exactement
        # celui qui part dans le .vsix ; `os-smoke` le lance sous Windows et macOS.
        # Déjà compressé : pas de recompression, et un jour de rétention.
        uses: actions/upload-artifact@v7
        with:
          name: validation-jar
          path: fhir-mapbuilder-validation/target/fhir-mapbuilder-validation.jar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Bundle the jar into the extension
        run: |
          mkdir -p vscode-extension/target
          cp fhir-mapbuilder-validation/target/fhir-mapbuilder-validation.jar vscode-extension/target/

      - name: Package the .vsix
        run: npx vsce package --baseImagesUrl=https://raw.githubusercontent.com/aphp/fhir-mapbuilder/refs/heads/main/vscode-extension
        working-directory: vscode-extension

      - name: Assert the validation jar is bundled in the .vsix
        working-directory: vscode-extension
        run: |
          vsix="$(ls *.vsix)"
          echo "inspecting $vsix"
          if unzip -l "$vsix" | grep -q 'fhir-mapbuilder-validation\.jar'; then
            echo "fhir-mapbuilder-validation.jar is present in $vsix"
          else
            echo "::error::fhir-mapbuilder-validation.jar is missing from $vsix"
            unzip -l "$vsix"
            exit 1
          fi

  os-smoke:
    name: os-smoke
    # Signal de parité OS (ADR 0005, attribut 4). Le nom `smoke` est pris par le job de
    # release.yml (propagation Open VSX) : celui-ci vérifie que le jar et le code TS
    # tournent sous Windows et macOS. NON requis dans le ruleset `main` : on le rend
    # requis une fois stablement vert (ADR 0001, « as each one first goes green »).
    # Limites assumées : la suite d'intégration `vscode-test` et le lancement réel du
    # processus par l'extension (`shell: true`) ne tournent pas ici.
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # mesuré : ~1 min 10 (macOS), ~1 min 50 (Windows) ; le smoke du jar attend jusqu'à 120 s
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the validation jar built on Linux
        uses: actions/download-artifact@v8
        with:
          name: validation-jar
          path: fhir-mapbuilder-validation/target

      - name: Smoke-test the validation jar (GET /health -> 200)
        shell: bash
        run: bash .github/scripts/smoke-jar.sh fhir-mapbuilder-validation/target/fhir-mapbuilder-validation.jar

      - name: Install Node dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Run the unit tests
        # Pas d'upload Codecov depuis ces jobs : les chiffres du composant `ts` viennent de Linux.
        run: npm run test:unit
        working-directory: vscode-extension

  audit-advisory:
    name: audit-advisory
    # PR uniquement, non bloquant (`fail-on-vuln: false`) : ne remonte que les
    # nouvelles vulnérabilités introduites par la PR et pousse le SARIF dans
    # l'onglet Security. Le scan hebdo complet vit dans `audit.yml`.
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    # Épinglé au tag exact : osv-scanner-action ne publie pas de tag majeur
    # mouvant (`@v2`). À garder aligné avec OSV_SCANNER_VERSION dans audit.yml.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    with:
      fail-on-vuln: false
      # Applique la allowlist racine `osv-scanner.toml` (elle ne se propage pas
      # d'elle-même aux manifestes en sous-dossier). Ne pas y mettre --format /
      # --output : le reusable workflow les fixe lui-même.
      scan-args: |-
        --config=./osv-scanner.toml
        -r
        ./
