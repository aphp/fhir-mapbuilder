name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Annule les runs en cours si un nouveau push arrive sur la même branche/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principe du moindre privilège : rien par défaut, chaque job élève au strict nécessaire
permissions: {}

jobs:
  lint-ts:
    name: lint-ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Lit engines.node depuis package.json — pas de version en dur, pas de matrix
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: ESLint
        run: npx eslint src
        working-directory: vscode-extension

      - name: Prettier (check)
        run: npx prettier --check "src/**/*.ts"
        working-directory: vscode-extension

  lint-java:
    name: lint-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: Spotless + SpotBugs
        # `compile` d'abord : sans target/classes, spotbugs:check passe à vide.
        run: mvn -B compile spotless:check spotbugs:check
        working-directory: fhir-mapbuilder-validation

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: tsc --noEmit
        run: npm run check-types
        working-directory: vscode-extension

  test-ts:
    name: test-ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Run extension tests (with xvfb)
        # Pas de couverture pour l'instant — branchée dans un ticket ultérieur
        run: xvfb-run -a npm test
        working-directory: vscode-extension

  test-java:
    name: test-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: mvn verify
        run: mvn -B verify
        working-directory: fhir-mapbuilder-validation

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: Install Node dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build the validation jar
        # -DskipTests : les tests Java tournent déjà dans le job test-java
        run: mvn -B package -DskipTests
        working-directory: fhir-mapbuilder-validation

      - name: Smoke-test the validation jar (GET /health -> 200)
        working-directory: fhir-mapbuilder-validation
        run: |
          java -jar target/fhir-mapbuilder-validation.jar &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # L'init du moteur Matchbox charge les paquets FHIR depuis le classpath
          # (pas de réseau) ; observé ~40 s en local, 120 s laisse de la marge sur
          # les runners CI plus lents.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9031/health || true)"
            if [ "$code" = "200" ]; then
              echo "jar healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done

          echo "::error::validation jar never returned 200 on /health within 120s"
          exit 1

      - name: Bundle the jar into the extension
        run: |
          mkdir -p vscode-extension/target
          cp fhir-mapbuilder-validation/target/fhir-mapbuilder-validation.jar vscode-extension/target/

      - name: Package the .vsix
        run: npx vsce package --baseImagesUrl=https://raw.githubusercontent.com/aphp/fhir-mapbuilder/refs/heads/main/vscode-extension
        working-directory: vscode-extension

      - name: Assert the validation jar is bundled in the .vsix
        working-directory: vscode-extension
        run: |
          vsix="$(ls *.vsix)"
          echo "inspecting $vsix"
          if unzip -l "$vsix" | grep -q 'fhir-mapbuilder-validation\.jar'; then
            echo "fhir-mapbuilder-validation.jar is present in $vsix"
          else
            echo "::error::fhir-mapbuilder-validation.jar is missing from $vsix"
            unzip -l "$vsix"
            exit 1
          fi
