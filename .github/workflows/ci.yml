name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Déclenché à la main par `release.yml` sur la branche de la PR de release :
  # release-please ouvre cette PR via le `GITHUB_TOKEN`, ce qui ne déclenche
  # aucun `pull_request`. `workflow_dispatch` est l'exception qui part quand
  # même depuis un contexte `GITHUB_TOKEN` — il rapporte les checks requis sur
  # le HEAD de la PR de release. Voir ADR 0003 §Amendments, wayfinder #126.
  workflow_dispatch:

# Annule les runs en cours si un nouveau push arrive sur la même branche/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principe du moindre privilège : rien par défaut, chaque job élève au strict nécessaire
permissions: {}

jobs:
  lint-ts:
    name: lint-ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Lit engines.node depuis package.json — pas de version en dur, pas de matrix
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: ESLint
        run: npx eslint src
        working-directory: vscode-extension

      - name: Prettier (check)
        run: npx prettier --check "src/**/*.ts"
        working-directory: vscode-extension

  lint-java:
    name: lint-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: Spotless + SpotBugs
        # `compile` d'abord : sans target/classes, spotbugs:check passe à vide.
        run: mvn -B compile spotless:check spotbugs:check
        working-directory: fhir-mapbuilder-validation

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: tsc --noEmit
        run: npm run check-types
        working-directory: vscode-extension

  test-ts:
    name: test-ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC : upload Codecov sans token
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build extension and test sources
        # `pretest` = compile-tests + compile (esbuild -> dist/) + lint ; requis
        # par les deux couches de test ci-dessous.
        run: npm run pretest
        working-directory: vscode-extension

      - name: Run unit tests with coverage
        # couche hors-hôte : mocha + c8 `--all --src src` -> coverage/unit/lcov.info
        run: npm run test:unit
        working-directory: vscode-extension

      - name: Run extension tests with coverage (with xvfb)
        # `--coverage` -> @vscode/test-cli + c8 -> vscode-extension/coverage/lcov.info
        run: xvfb-run -a npm run test:integration -- --coverage
        working-directory: vscode-extension

      - name: Upload unit coverage to Codecov (flag ts)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: vscode-extension/coverage/unit/lcov.info
          flags: ts

      - name: Upload extension coverage to Codecov (flag ts)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: vscode-extension/coverage/lcov.info
          flags: ts

  test-java:
    name: test-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC : upload Codecov sans token
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: mvn verify
        # jacoco:report (phase test) écrit target/site/jacoco/jacoco.xml
        run: mvn -B verify
        working-directory: fhir-mapbuilder-validation

      - name: Upload coverage to Codecov (flag java)
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: fhir-mapbuilder-validation/target/site/jacoco/jacoco.xml
          flags: java

  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: Install Node dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build the validation jar
        # -DskipTests : les tests Java tournent déjà dans le job test-java
        run: mvn -B package -DskipTests
        working-directory: fhir-mapbuilder-validation

      - name: Smoke-test the validation jar (GET /health -> 200)
        working-directory: fhir-mapbuilder-validation
        run: |
          java -jar target/fhir-mapbuilder-validation.jar &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # L'init du moteur Matchbox charge les paquets FHIR depuis le classpath
          # (pas de réseau) ; observé ~40 s en local, 120 s laisse de la marge sur
          # les runners CI plus lents.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9031/health || true)"
            if [ "$code" = "200" ]; then
              echo "jar healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done

          echo "::error::validation jar never returned 200 on /health within 120s"
          exit 1

      - name: Bundle the jar into the extension
        run: |
          mkdir -p vscode-extension/target
          cp fhir-mapbuilder-validation/target/fhir-mapbuilder-validation.jar vscode-extension/target/

      - name: Package the .vsix
        run: npx vsce package --baseImagesUrl=https://raw.githubusercontent.com/aphp/fhir-mapbuilder/refs/heads/main/vscode-extension
        working-directory: vscode-extension

      - name: Assert the validation jar is bundled in the .vsix
        working-directory: vscode-extension
        run: |
          vsix="$(ls *.vsix)"
          echo "inspecting $vsix"
          if unzip -l "$vsix" | grep -q 'fhir-mapbuilder-validation\.jar'; then
            echo "fhir-mapbuilder-validation.jar is present in $vsix"
          else
            echo "::error::fhir-mapbuilder-validation.jar is missing from $vsix"
            unzip -l "$vsix"
            exit 1
          fi

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    # PR uniquement : le job compare le graphe de dépendances base <-> head.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency review
        # Épinglé au tag exact : le projet ne publie pas de tag majeur mouvant
        # (`@v5`) — contrairement à actions/checkout & co. Dependabot (écosystème
        # github-actions) le fait avancer.
        uses: actions/dependency-review-action@v5.0.0
        with:
          # Bloque toute dépendance *nouvellement introduite* portant une
          # vulnérabilité de sévérité haute ou critique.
          fail-on-severity: high
          # Refuse l'entrée de dépendances sous copyleft fort. EPL / MPL-2.0 /
          # CDDL restent tolérées (non listées ci-dessous).
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later
          # Allowlist d'exceptions au cas par cas (PURL), p. ex. :
          #   pkg:maven/com.example/foo, pkg:npm/bar
          # Vide = aucune exception.
          allow-dependencies-licenses: ""

  audit-advisory:
    name: audit-advisory
    # PR uniquement, non bloquant (`fail-on-vuln: false`) : ne remonte que les
    # nouvelles vulnérabilités introduites par la PR et pousse le SARIF dans
    # l'onglet Security. Le scan hebdo bloquant vit dans `audit.yml`.
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    # Épinglé au tag exact : osv-scanner-action ne publie pas de tag majeur
    # mouvant (`@v2`). À garder aligné avec OSV_SCANNER_VERSION dans audit.yml.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1
    with:
      fail-on-vuln: false
      # Applique la allowlist racine `osv-scanner.toml` (elle ne se propage pas
      # d'elle-même aux manifestes en sous-dossier). Ne pas y mettre --format /
      # --output : le reusable workflow les fixe lui-même.
      scan-args: |-
        --config=./osv-scanner.toml
        -r
        ./
