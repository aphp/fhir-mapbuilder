name: Audit dependencies

# Veille de fond hebdomadaire, complémentaire de la barrière advisory sur PR
# (job `audit-advisory` de `ci.yml`). Rejoue OSV-Scanner contre `pom.xml` +
# `package-lock.json` et publie le SARIF dans l'onglet Security. Mécanisme de
# suppression par CVE : `osv-scanner.toml` (cf. CONTRIBUTING.md).
#
# Le canal de signalement est le Code scanning de GitHub : chaque vulnérabilité
# est une alerte (catégorie `osv-scanner`) qui se ferme d'elle-même quand la
# dépendance est corrigée. Ce workflow n'ouvre plus d'issue : elle ne se fermait
# jamais toute seule et doublonnait l'alerte. ADR 0002 §Amendments (2026-09-20).
#
# Une vulnérabilité trouvée est un résultat du scan, pas une panne : le job reste
# vert et le signal passe par l'onglet Security. Le job n'échoue que si le scan
# lui-même ne peut pas être mené (aucun paquet ramassé, panne du binaire).
on:
  schedule:
    - cron: "0 6 * * 1" # lundi 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-${{ github.workflow }}
  cancel-in-progress: false

env:
  # Version du binaire OSV-Scanner. À garder alignée avec le tag du reusable
  # workflow `osv-scanner-reusable-pr.yml` épinglé dans `ci.yml`.
  OSV_SCANNER_VERSION: v2.5.1

jobs:
  audit:
    name: osv-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload du SARIF vers Code scanning
      actions: read # requis par codeql-action/upload-sarif
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install OSV-Scanner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          url="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$RUNNER_TEMP/bin/osv-scanner" "$url"
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/osv-scanner" --version

      - name: Run OSV-Scanner
        id: scan
        # `scan source -r` couvre `pom.xml` (résolution transitive via deps.dev)
        # et `package-lock.json` en une passe. Les répertoires ignorés par git
        # (node_modules, target, .vscode-test…) sont exclus d'office.
        #
        # Le code de sortie est classé à la main :
        #   0                 -> aucune vulnérabilité
        #   1                 -> vulnérabilités trouvées : un résultat, pas une erreur. Le
        #                        job reste vert ; le signal passe par le SARIF, donc par
        #                        les alertes Code scanning (onglet Security)
        #   128               -> aucun paquet ramassé : traité comme une erreur de configuration
        #   >= 127 (hors 128) -> panne (réseau, binaire…) : échec du job, SARIF non publié
        run: |
          set +e
          osv-scanner scan source -r \
            --config=./osv-scanner.toml \
            --format=sarif --output=osv.sarif .
          code=$?
          set -e
          echo "osv-scanner exit code: $code"

          # `sarif-written` gouverne l'upload : on ne publie le SARIF que pour un
          # scan mené à terme (0 = propre, 1 = vulnérabilités). Sur 128 / panne,
          # le fichier est absent ou partiel — on ne l'envoie pas.
          case "$code" in
            0)
              echo "sarif-written=$( [ -s osv.sarif ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
              echo "OSV-Scanner : aucune vulnérabilité connue."
              ;;
            1)
              echo "sarif-written=$( [ -s osv.sarif ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
              echo "::warning::OSV-Scanner a trouvé au moins une vulnérabilité connue — voir les alertes Code scanning."
              ;;
            128)
              echo "sarif-written=false" >> "$GITHUB_OUTPUT"
              echo "::error::OSV-Scanner n'a ramassé aucun paquet (exit 128) — erreur de configuration."
              exit 1
              ;;
            *)
              echo "sarif-written=false" >> "$GITHUB_OUTPUT"
              echo "::error::OSV-Scanner a échoué (exit $code) — panne, pas un résultat de vulnérabilité."
              exit "$code"
              ;;
          esac

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif-written == 'true' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner
