name: Release

# Chaîne de release pilotée par release-please (ADR 0003).
#
# Sur push `main` : `release-please` ouvre / met à jour la PR de release. Quand
# cette PR est mergée, release-please crée le tag + la GitHub Release et expose
# `release_created == 'true'` : déclencheur des jobs
# `build` -> `publish-*` -> `smoke`.
#
# `workflow_dispatch` (input `dry_run`) : répétition manuelle du pipeline.
#   - `dry_run: true` (défaut) — `build` package le `.vsix` et le smoke-teste,
#     rien n'est publié, aucun tag / Release / PR de release n'est touché
#     (`release-please` est sauté). Voir wayfinder #113.
#   - `dry_run: false` — chemin de publication / reprise manuelle : `build` puis
#     `publish-*` sur le HEAD de `main` (utile si un merge de PR de release n'a
#     rien déclenché, ou pour rejouer une publication après correction d'un PAT).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package + smoke only, do not publish"
        type: boolean
        default: true

# Rien par défaut : chaque job élève au strict nécessaire.
permissions: {}

# Une seule release à la fois ; on ne coupe pas un run en cours (il peut être
# en train de publier).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # Sauté sur `workflow_dispatch` : une répétition ne doit toucher ni la PR de
    # release, ni le tag, ni la GitHub Release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer le tag et la GitHub Release
      pull-requests: write # ouvrir / mettre à jour la PR de release
      issues: write # release-please étiquette des issues liées
      actions: write # `gh workflow run` : re-déclencher les checks sur la PR de release
    outputs:
      # Composant racine unique (`.` dans release-please-config.json) : les
      # sorties de release-please-action ne sont donc pas préfixées par un chemin.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Kick required checks onto the release PR
        # release-please ouvre / met à jour sa PR via le `GITHUB_TOKEN`, ce qui
        # n'émet aucun `pull_request` : `ci.yml` / `commit-policy.yml` ne
        # tournent pas et la PR reste BLOCKED sur les checks requis. On les
        # relance via `workflow_dispatch` (seul déclencheur qui part depuis un
        # contexte `GITHUB_TOKEN`) sur la branche de la PR ; les runs rapportent
        # leurs checks sur son HEAD SHA = HEAD de la PR. Rejoué à chaque push
        # `main` qui met la PR à jour (force-push de release-please inclus).
        # Voir ADR 0003 §Amendments, wayfinder #126.
        # `pr` est vide quand aucun push n'ouvre de PR de release ; `fromJSON('')`
        # casserait le template même avec un `if:` faux, donc on garde sur
        # `prs_created` et on lit la branche au `jq` dans le script, pas en `env`.
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName')"
          echo "release PR branch: $branch"
          gh workflow run ci.yml            --ref "$branch"
          gh workflow run commit-policy.yml --ref "$branch"

  build:
    name: build
    needs: [release-please]
    # Vraie release (PR de release mergée) OU répétition manuelle.
    if: >-
      !cancelled()
      && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload (push uniquement)
    steps:
      - name: Checkout the release tag (or main on dispatch)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: vscode-extension/package.json
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: fhir-mapbuilder-validation/pom.xml

      - name: Install Node dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Build the validation jar
        # Pas de re-test : la PR de release est passée par ci.yml au merge.
        run: mvn -B package -DskipTests
        working-directory: fhir-mapbuilder-validation

      - name: Smoke-test the validation jar (GET /health -> 200)
        working-directory: fhir-mapbuilder-validation
        run: |
          java -jar target/fhir-mapbuilder-validation.jar &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          # L'init du moteur Matchbox charge les paquets FHIR depuis le classpath
          # (pas de réseau) ; ~40 s en local, 120 s de marge sur les runners CI.
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9031/health || true)"
            if [ "$code" = "200" ]; then
              echo "jar healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done

          echo "::error::validation jar never returned 200 on /health within 120s"
          exit 1

      - name: Bundle the jar into the extension
        run: |
          mkdir -p vscode-extension/target
          cp fhir-mapbuilder-validation/target/fhir-mapbuilder-validation.jar vscode-extension/target/

      - name: Package the .vsix
        run: npx vsce package --baseImagesUrl=https://raw.githubusercontent.com/aphp/fhir-mapbuilder/refs/heads/main/vscode-extension
        working-directory: vscode-extension

      - name: Assert the validation jar is bundled in the .vsix
        working-directory: vscode-extension
        run: |
          vsix="$(ls *.vsix)"
          echo "inspecting $vsix"
          if unzip -l "$vsix" | grep -q 'fhir-mapbuilder-validation\.jar'; then
            echo "fhir-mapbuilder-validation.jar is present in $vsix"
          else
            echo "::error::fhir-mapbuilder-validation.jar is missing from $vsix"
            unzip -l "$vsix"
            exit 1
          fi

      - name: Attach the .vsix and jar to the GitHub Release
        # Vraie release uniquement : sur `workflow_dispatch` il n'y a pas de Release.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            vscode-extension/*.vsix \
            vscode-extension/target/fhir-mapbuilder-validation.jar \
            --clobber

      - name: Upload the .vsix as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-extension/*.vsix
          retention-days: 5
          if-no-files-found: error

  publish-marketplace:
    name: publish-marketplace
    needs: [release-please, build]
    # Vraie release, OU dispatch explicitement `dry_run: false` (publication /
    # reprise manuelle). Un dispatch par défaut ne publie jamais.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: vscode-marketplace
    steps:
      - name: Download the packaged .vsix
        # Épinglé par SHA (v4.3.0) : ce job manipule le PAT de publication.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vsix

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Publish to the VS Code Marketplace
        env:
          # Dette PAT — échéance 2026-12-01 (ADR 0003). Le Marketplace n'accepte
          # pas encore le trusted publishing OIDC comme Open VSX.
          VSCE_PAT: ${{ secrets.P_A_T }}
        run: npx --yes @vscode/vsce publish --packagePath *.vsix -p "$VSCE_PAT"

  publish-openvsx:
    name: publish-openvsx
    needs: [release-please, build]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: open-vsx
    steps:
      - name: Download the packaged .vsix
        # Épinglé par SHA (v4.3.0) : ce job publie sur un registre externe.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vsix

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Publish to Open VSX
        # Open VSX ne propose pas (encore) de trusted publishing OIDC et la CLI
        # `ovsx` n'expose que `--pat` — on publie donc au PAT, comme le
        # Marketplace. Dette suivie dans l'ADR 0003 (échéance 2026-12-01).
        # Prérequis manuel : namespace `aphp` + `OVSX_PAT` dans l'environnement.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"

  smoke:
    name: smoke
    needs: [release-please, publish-marketplace, publish-openvsx]
    # Vraie release uniquement : sur `workflow_dispatch` les jobs `publish-*` sont
    # sautés, ce job l'est donc aussi.
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    # Post-publication : un échec ici ne remet pas la release en cause (elle est
    # déjà publiée). Le job reste vert dans le cas nominal — un rouge signale
    # donc une vraie anomalie de propagation Open VSX.
    continue-on-error: true
    steps:
      - name: Verify the release surfaced on Open VSX (Marketplace advisory)
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -u
          version="${TAG#v}"

          # Barrière : Open VSX expose la nouvelle version en ~1 min. 10 min de marge.
          ok_ovsx=""
          for i in $(seq 1 20); do
            if curl -fsSL "https://open-vsx.org/api/aphp/fhir-mapbuilder/$version" >/dev/null 2>&1; then
              echo "open-vsx: $version is live"
              ok_ovsx=1
              break
            fi
            echo "open-vsx: $version not visible yet ($i/20)"
            sleep 30
          done

          # Advisory : l'ingestion Marketplace peut traîner 15-60 min, bien au-delà
          # de la fenêtre de ce job. Le succès du job `publish-marketplace` a déjà
          # prouvé l'upload ; on ne fait que journaliser ici, sans jamais échouer.
          if npx --yes @vscode/vsce show aphp.fhir-mapbuilder --json 2>/dev/null \
              | grep -q "\"version\": *\"$version\""; then
            echo "marketplace: $version is live"
          else
            echo "::notice::marketplace: $version pas encore visible via l'API galerie (lag d'ingestion, pas un échec de release). Voir https://marketplace.visualstudio.com/items?itemName=aphp.fhir-mapbuilder"
          fi

          [ -n "$ok_ovsx" ]
